<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Login Seguro y Alegre</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand">
          <span class="brand-badge" aria-hidden="true">IA</span>
          <p class="brand-kicker">Acceso protegido</p>
          <h1 id="login-title">Bienvenido</h1>
          <p class="brand-copy">Inicia sesión para continuar.</p>
        </div>

        <form id="loginForm" novalidate>
          <label for="username">Usuario</label>
          <input
            id="username"
            name="username"
            type="text"
            maxlength="32"
            autocomplete="username"
            required
            pattern="[A-Za-z0-9._-]{4,32}"
            aria-describedby="usernameHelp"
          />
          <small id="usernameHelp">Usa 4-32 caracteres: letras, números, . _ -</small>

          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              minlength="8"
              maxlength="64"
              autocomplete="current-password"
              required
              aria-describedby="passwordHelp"
            />
            <button type="button" id="togglePassword" class="ghost-btn" aria-label="Mostrar u ocultar contraseña">
              Mostrar
            </button>
          </div>
          <small id="passwordHelp">Mínimo 8 caracteres.</small>

          <button type="submit" id="submitBtn" class="primary-btn">Entrar</button>
        </form>

        <p id="status" class="status" role="alert" aria-live="polite"></p>

        <details class="hint-box">
          <summary>Credenciales de demostración</summary>
          <p>Usuario: <strong>admin2026</strong></p>
          <p>Contraseña: <strong>ClaveSegura!2026</strong></p>
        </details>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
